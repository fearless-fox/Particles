<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FUAX // Neural Glitch Stream Background</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #050505; }
        #container { position: fixed; inset: 0; }
        #container canvas { display: block; }
        #start-overlay {
            position: fixed; inset: 0; z-index: 10;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: rgba(5,5,5,0.85); cursor: pointer;
            font-family: 'Courier New', monospace; color: #EDEDE6;
            transition: opacity 0.6s ease;
        }
        #start-overlay.hidden { opacity: 0; pointer-events: none; }
        #start-overlay h1 {
            font-size: clamp(1.5rem, 4vw, 3rem); letter-spacing: 0.35em;
            color: #C13E1B; text-shadow: 0 0 24px rgba(193,62,27,0.6);
            margin-bottom: 1rem;
        }
        #start-overlay p { font-size: 0.85rem; letter-spacing: 0.15em; opacity: 0.7; }
        #start-overlay .blink { animation: blink 1.2s steps(2) infinite; margin-top: 2rem; color: #C13E1B; }
        @keyframes blink { 50% { opacity: 0.2; } }
    </style>
</head>
<body>
    <div id="container"></div>
    <div id="start-overlay">
        <h1>NEURAL GLITCH</h1>
        <p>FUAX STREAM BACKGROUND</p>
        <p class="blink">[ CLICK TO ENABLE AUDIO ]</p>
        <p style="margin-top:1rem; font-size:0.7rem;">mic reactive &mdash; deny for ambient auto-pilot</p>
    </div>
    <script type="module" src="stream.js"></script>
</body>
</html>
